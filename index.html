
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Interrogation Studio</title>
<style>
:root{
 --bg:#03050d;--panel:#090d1e;--panel2:#0e1330;--line:#242b55;
 --text:#f7f7ff;--muted:#969bc1;--purple:#9d48ff;--pink:#ef43ef;
 --green:#31e6a2;--red:#ff4d78;--blue:#4e8cff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 78% 8%,#21105a 0,#080a18 35%,#03050d 80%);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{height:70px;display:flex;align-items:center;gap:18px;padding:0 20px;position:sticky;top:0;z-index:50;background:#040610ee;border-bottom:1px solid #1c2244;backdrop-filter:blur(16px)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#9a3dff,#457fff);display:grid;place-items:center;box-shadow:0 0 28px #7b3fff55}.logo:after{content:"◆";font-size:15px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand small{display:block;color:#777da5;font-weight:500;font-size:10px}
.actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid #2b315a;background:#0c1027;color:#fff;padding:9px 12px;border-radius:10px;transition:.15s}
.btn:hover{border-color:#8256ff;transform:translateY(-1px)}.btn.primary{border:0;background:linear-gradient(135deg,#a342ff,#5b39ff);box-shadow:0 8px 25px #7438ff33}.btn.green{background:#0c2b25;border-color:#176c57}
.status{position:fixed;right:18px;bottom:18px;z-index:100;padding:11px 14px;border-radius:12px;background:#121833;border:1px solid #343d70;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.status.show{opacity:1;transform:none}
.layout{display:grid;grid-template-columns:510px minmax(0,1fr);gap:18px;padding:18px;max-width:1800px;margin:auto}
.editor{background:#080b1bee;border:1px solid #202750;border-radius:20px;overflow:auto;max-height:calc(100vh - 106px);box-shadow:0 25px 80px #0007}
.section{padding:17px;border-bottom:1px solid #1b2140}.section h3{margin:0 0 12px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#d9d5ff}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin:6px 0 0}
.field{margin:9px 0}.field>label{display:block;font-size:11px;color:#bfc3df;margin-bottom:6px}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;border:1px solid #252c52;background:#070a1b;color:#fff;border-radius:10px;padding:9px;outline:none}
textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#8857ff;box-shadow:0 0 0 3px #8757ff13}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.color{width:100%;height:40px;padding:3px;border:1px solid #252c52;background:#070a1b;border-radius:10px}
.check{display:flex;gap:8px;align-items:center;color:#cdd0e8;font-size:12px;margin:9px 0}.check input{accent-color:#9a45ff;width:17px;height:17px}
.filebox{display:grid;grid-template-columns:1fr auto;gap:7px}.filelabel{display:block;text-align:center;padding:10px;border:1px dashed #3a416b;background:#070a1b;border-radius:10px;color:#aaaed0}.filelabel input{display:none}
.asset{width:100%;height:110px;object-fit:cover;background:#070a18;border:1px solid #252c52;border-radius:10px;margin-top:7px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tab{white-space:nowrap;padding:8px 10px;border-radius:9px;border:1px solid #2b3159;background:#090d20;color:#bfc3df}.tab:hover{border-color:#8757ff}
.questions{max-height:560px;overflow:auto}.qcard{background:#080c1e;border:1px solid #262d54;border-radius:14px;margin:9px 0;padding:12px}.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}.qtop b{font-size:12px}.mini{padding:7px 9px;background:#10152e;color:#ddd;border:1px solid #2d345d;border-radius:8px}
.qtext{min-height:92px}.option-editor{margin-top:7px}.option-row{display:grid;grid-template-columns:1fr auto;gap:5px;margin:5px 0}.danger{border-color:#71314c!important;background:#28101d!important}
.footer{padding:15px;text-align:center;color:#6f759c;font-size:11px}
.preview{min-width:0}.previewbox{height:calc(100vh - 106px);min-height:650px;position:sticky;top:88px;border:1px solid #202750;border-radius:20px;overflow:hidden;background:#050611;box-shadow:0 25px 90px #0008}.previewbox iframe{width:100%;height:100%;border:0}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.editor{max-height:none}.previewbox{position:relative;top:auto;height:780px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"></div>
  <div class="brand">Neon Interrogation Studio<div><small id="authorTop"></small></div></div>
  <div class="actions">
    <button class="btn" id="newBtn"></button>
    <button class="btn" id="saveBtn"></button>
    <button class="btn" id="loadBtn"></button>
    <button class="btn green" id="copyBtn"></button>
    <button class="btn primary" id="downloadBtn"></button>
    <input id="loadFile" type="file" accept=".json,application/json" hidden>
  </div>
</header>

<div class="layout">
<section class="editor">
  <div class="section">
    <h3 data-i18n="basic"></h3>
    <div class="field"><label data-i18n="gameTitle"></label><input id="title" data-path="title" type="text"></div>
    <div class="field"><label data-i18n="subtitle"></label><input data-path="subtitle" type="text"></div>
    <div class="row">
      <div class="field"><label data-i18n="language"></label><select id="language" data-path="lang"></select></div>
      <div class="field"><label data-i18n="font"></label><select id="font" data-path="font"></select></div>
    </div>
    <div class="row3">
      <div class="field"><label data-i18n="fontSizeTitle"></label><input type="number" min="12" max="100" data-path="style.titleSize"></div>
      <div class="field"><label data-i18n="fontSizeQuestion"></label><input type="number" min="12" max="80" data-path="style.questionSize"></div>
      <div class="field"><label data-i18n="fontSizeAnswer"></label><input type="number" min="10" max="50" data-path="style.answerSize"></div>
    </div>
    <div class="row3">
      <div class="field"><label data-i18n="titleColor"></label><input class="color" type="color" data-path="style.titleColor"></div>
      <div class="field"><label data-i18n="questionColor"></label><input class="color" type="color" data-path="style.questionColor"></div>
      <div class="field"><label data-i18n="answerColor"></label><input class="color" type="color" data-path="style.answerColor"></div>
    </div>
    <div class="row3">
      <div class="field"><label data-i18n="buttonColor"></label><input class="color" type="color" data-path="style.buttonColor"></div>
      <div class="field"><label data-i18n="cardColor"></label><input class="color" type="color" data-path="style.cardColor"></div>
      <div class="field"><label data-i18n="gameBackgroundColor"></label><input class="color" type="color" data-path="style.gameBg"></div>
    </div>
  </div>

  <div class="section">
    <h3 data-i18n="titleScreen"></h3>
    <label class="check"><input type="checkbox" data-path="titlePage.enabled"><span data-i18n="enableTitle"></span></label>
    <div class="field"><label data-i18n="titleBackground"></label><div class="filebox"><label class="filelabel"><span data-i18n="upload"></span><input id="titleBgUpload" type="file" accept="image/*"></label><button class="mini" id="clearTitleBg" data-i18n="clear"></button></div><img class="asset" id="titleBgPreview"></div>
    <div class="field"><label data-i18n="titleBgOpacity"></label><input type="range" min="0" max="100" data-path="titlePage.opacity"><div class="hint"><span id="opacityValue">70</span>%</div></div>
    <div class="row">
      <div class="field"><label data-i18n="titleCardColor"></label><input class="color" type="color" data-path="titlePage.cardColor"></div>
      <div class="field"><label data-i18n="titleButtonText"></label><input type="text" data-path="titlePage.buttonText"></div>
    </div>
  </div>

  <div class="section">
    <h3 data-i18n="suspect"></h3>
    <div class="row"><div class="field"><label data-i18n="suspectName"></label><input type="text" data-path="suspect.name"></div><div class="field"><label data-i18n="suspectRole"></label><input type="text" data-path="suspect.role"></div></div>
    <div class="field"><label data-i18n="characterImage"></label><div class="filebox"><label class="filelabel"><span data-i18n="upload"></span><input id="suspectUpload" type="file" accept="image/*"></label><button class="mini" id="clearSuspect" data-i18n="clear"></button></div><img class="asset" id="suspectPreview"></div>
    <div class="field"><label data-i18n="gameBackground"></label><div class="filebox"><label class="filelabel"><span data-i18n="upload"></span><input id="gameBgUpload" type="file" accept="image/*"></label><button class="mini" id="clearGameBg" data-i18n="clear"></button></div><img class="asset" id="gameBgPreview"></div>
  </div>

  <div class="section">
    <h3 data-i18n="rules"></h3>
    <div class="row3">
      <div class="field"><label data-i18n="lives"></label><input type="number" min="1" max="20" data-path="rules.lives"></div>
      <div class="field"><label data-i18n="timer"></label><input type="number" min="0" max="3600" data-path="rules.timer"></div>
      <div class="field"><label data-i18n="interval"></label><input type="number" min="0" max="60" step=".1" data-path="rules.interval"></div>
    </div>
    <label class="check"><input type="checkbox" data-path="rules.polygraph"><span data-i18n="polygraph"></span></label>
    <label class="check"><input type="checkbox" data-path="rules.random"><span data-i18n="random"></span></label>
  </div>

  <div class="section">
    <h3 data-i18n="taskStyle"></h3>
    <div class="row3">
      <div class="field"><label data-i18n="taskQuestionSize"></label><input type="number" min="12" max="80" data-path="task.questionSize"></div>
      <div class="field"><label data-i18n="taskAnswerSize"></label><input type="number" min="10" max="50" data-path="task.answerSize"></div>
      <div class="field"><label data-i18n="radius"></label><input type="number" min="0" max="50" data-path="task.radius"></div>
    </div>
    <div class="row3">
      <div class="field"><label data-i18n="taskCard"></label><input class="color" type="color" data-path="task.card"></div>
      <div class="field"><label data-i18n="optionCard"></label><input class="color" type="color" data-path="task.option"></div>
      <div class="field"><label data-i18n="correctColor"></label><input class="color" type="color" data-path="task.correct"></div>
    </div>
    <div class="field"><label data-i18n="math"></label><textarea data-path="mathHelp" placeholder="x^2, a_1, \frac{a}{b}, √(x)"></textarea></div>
  </div>

  <div class="section">
    <h3 data-i18n="questions"></h3>
    <div class="tabs">
      <button class="tab addq" data-type="single" data-i18n="one"></button>
      <button class="tab addq" data-type="multi" data-i18n="many"></button>
      <button class="tab addq" data-type="text" data-i18n="textAnswer"></button>
      <button class="tab addq" data-type="oral" data-i18n="oral"></button>
      <button class="tab addq" data-type="lie" data-i18n="lie"></button>
    </div>
    <div class="hint" data-i18n="teacherHint"></div>
    <div class="questions" id="questions"></div>
  </div>

  <div class="section">
    <h3 data-i18n="genially"></h3>
    <div class="field"><label data-i18n="publishedUrl"></label><input id="publishUrl" type="url" data-path="publishUrl"></div>
    <div class="hint" data-i18n="geniallyHint"></div>
  </div>

  <div class="section">
    <button class="btn primary" id="testBtn" data-i18n="test"></button>
    <button class="btn" id="resetBtn" data-i18n="reset"></button>
    <div class="hint" data-i18n="liveHint"></div>
  </div>
  <div class="footer">Автор: <b>Гальмиз Мария Александровна</b></div>
</section>

<section class="preview">
  <div class="previewbox"><iframe id="preview"></iframe></div>
</section>
</div>
<div class="status" id="status"></div>

function updateTimer(){const x=document.querySelector("#timerText"),f=document.querySelector(".fill");if(x)x.textContent=left+"s";if(f)f.style.width=Math.max(0,left/CFG.rules.timer*100)+"%"}
function poly(lie){if(!CFG.rules.polygraph)return;const n=document.querySelector(".needle"),r=document.querySelector(".red"),g=document.querySelector(".green"),p=document.querySelector("#wave");if(!n)return;n.style.left=(lie?88:20)+"%";r.classList.toggle("on",lie);g.classList.toggle("on",!lie);let d="M0 50";for(let x=0;x<=500;x+=8){let y=50+Math.sin(x/(lie?6:16))*(lie?25:7)+(Math.random()-.5)*(lie?9:2);d+=" L"+x+" "+y}p.setAttribute("d",d)}
function draw(){const q=qs[idx],lie=q.type==="lie";root.innerHTML='<div class="top"><div><div class="game-title">'+esc(CFG.title)+'</div><div class="subtitle">'+esc(CFG.subtitle)+'</div></div><div class="hud"><span class="badge">'+esc(T.gameLives)+": "+'❤'.repeat(Math.max(0,lives))+'</span>'+(CFG.rules.timer>0?'<span class="badge">'+esc(T.gameTime)+': <span id="timerText">'+left+'s</span></span>':'')+'</div></div><div class="main"><div><div class="suspect">'+(CFG.suspect.img?'<img src="'+CFG.suspect.img+'">':'')+'<div class="who">'+esc(CFG.suspect.name||"")+'</div><div class="role">'+esc(CFG.suspect.role||"")+'</div></div><div class="poly"><div class="polyhead"><span>'+esc(T.gamePolygraph)+'</span><span id="zone">'+esc(T.gameNormal)+'</span></div><div class="zone"><i class="needle"></i></div><div class="lights"><i class="light green"></i><i class="light red"></i></div><div class="chart"><svg viewBox="0 0 500 100" preserveAspectRatio="none"><path id="wave" d="M0 50 L500 50" fill="none" stroke="#7f8aff" stroke-width="3"/></svg></div></div></div><div class="task"><div class="label">'+(lie?T.gameStatement:T.gameQuestion)+' · '+(idx+1)+' / '+qs.length+'</div><div class="question">'+math(q.text)+'</div><div id="area"></div><div class="actions" id="actions"></div><div class="notice" id="notice"></div></div></div>'+(CFG.rules.timer>0?'<div class="timer"><div class="fill"></div></div>':'');poly(lie&&!q.truth);answer(q)}
function answer(q){const area=document.querySelector("#area"),a=document.querySelector("#actions");if(q.type==="lie"){area.innerHTML='<div class="notice">'+(q.truth?T.gameTruth:T.gameFalse)+'</div>';a.innerHTML='<button class="btn lie" onclick="judge(false)">'+T.gameLie+'</button><button class="btn secondary" onclick="judge(true)">'+T.gameTruth+'</button>';return}if(q.type==="oral"){area.innerHTML='<div class="notice" id="oralStatus">'+T.gameOral+'</div><button class="option" id="micBtn" type="button">🎙 '+T.gameSubmit+'</button>';a.innerHTML='<button class="btn secondary" onclick="good()">'+T.gameCheck+'</button>';const mb=document.getElementById("micBtn");const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){mb.onclick=()=>{const r=new SR();r.lang=CFG.lang==="ru"?"ru-RU":CFG.lang==="en"?"en-US":CFG.lang==="kk"?"kk-KZ":CFG.lang+"-"+CFG.lang.toUpperCase();r.onstart=()=>document.getElementById("oralStatus").textContent=T.gameOral+" …";r.onresult=e=>document.getElementById("oralStatus").textContent=e.results[0][0].transcript;r.onerror=()=>document.getElementById("oralStatus").textContent=T.gameOral;r.start()}}else mb.disabled=true;return}if(q.type==="text"){area.innerHTML='<input id="text" class="answer-input" placeholder="'+esc(T.gameAnswer)+'">';a.innerHTML='<button class="btn" onclick="checkText()">'+T.gameCheck+'</button>';return}area.innerHTML='<div class="options">'+q.options.map((x,j)=>'<button class="option" onclick="pick('+j+')" data-j="'+j+'">'+math(x)+'</button>').join("")+'</div>';a.innerHTML='<button class="btn" onclick="checkChoice()">'+T.gameCheck+'</button>'}
function pick(j){const q=qs[idx];selected=q.type==="single"?[j]:(selected.includes(j)?selected.filter(x=>x!==j):selected.concat(j));document.querySelectorAll(".option").forEach((x,k)=>x.classList.toggle("selected",selected.includes(k)))}
function checkChoice(){const q=qs[idx],a=[...selected].sort(),c=[...q.correct].sort();if(JSON.stringify(a)===JSON.stringify(c)){document.querySelectorAll(".option").forEach((x,k)=>x.classList.toggle("correct",c.includes(k)));good()}else{document.querySelectorAll(".option").forEach((x,k)=>{if(selected.includes(k))x.classList.add("wrong")});wrong()}}
function checkText(){const v=(document.querySelector("#text").value||"").trim().toLowerCase(),q=qs[idx];if(q.correct.some(x=>v===String(x).trim().toLowerCase()))good();else{document.querySelector("#text").classList.add("wrong");wrong()}}
function judge(truthPressed){const q=qs[idx];if(truthPressed===q.truth){poly(!q.truth);if(!q.truth&&document.querySelector("#zone"))document.querySelector("#zone").textContent=T.gameStress;if(q.truth&&document.querySelector("#zone"))document.querySelector("#zone").textContent=T.gameNormal;if(q.truth)good();else showRebut()}else wrong()}
function showRebut(){const q=qs[idx];document.querySelector("#area").innerHTML='<div class="label">'+T.gameRebuttal+'</div><div class="options">'+q.rebuttals.map((x,j)=>'<button class="option" onclick="rebut('+j+')">'+esc(x)+'</button>').join("")+'</div>';document.querySelector("#actions").innerHTML=""}
function rebut(j){const q=qs[idx];if(j===q.correctRebuttal)good();else wrong()}
function good(){clearInterval(timer);const n=document.querySelector("#notice");if(n)n.textContent=T.gameCorrect;setTimeout(next,Math.max(0,CFG.rules.interval*1000))}
function wrong(){clearInterval(timer);lives--;const n=document.querySelector("#notice");if(n)n.textContent=T.gameWrong;if(lives<=0){setTimeout(()=>end(false),600);return}setTimeout(next,Math.max(0,CFG.rules.interval*1000))}
function end(win){clearInterval(timer);root.innerHTML='<div class="end"><h2>'+esc(win?T.gameWin:T.gameOver)+'</h2><p>'+esc(T.gameLives)+": "+lives+'</p><button class="btn" onclick="start()">'+esc(T.gameRestart)+'</button></div>'}
window.addEventListener("message",e=>{if(e.data?.cmd==="start")start();if(e.data?.cmd==="reset")startScreen()});
startScreen();
<\/script></body></html>`;
}
let previewTimer=0;
function schedulePreview(){clearTimeout(previewTimer);previewTimer=setTimeout(renderPreview,120)}
function renderPreview(){
 const frame=$("#preview");
 let sx=0,sy=0;
 try{sx=frame.contentWindow?.scrollX||0;sy=frame.contentWindow?.scrollY||0}catch{}
 const restore=()=>{try{frame.contentWindow.scrollTo(sx,sy)}catch{}};
 frame.onload=restore;
 frame.srcdoc=gameHtml();
}
function post(x){$("#preview").contentWindow?.postMessage(x,"*")}
function save(){const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="interrogation-project.json";a.click();URL.revokeObjectURL(a.href);toast("saved")}
function load(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=Object.assign(clone(DEFAULT),JSON.parse(r.result));state.style=Object.assign(clone(DEFAULT.style),state.style);state.titlePage=Object.assign(clone(DEFAULT.titlePage),state.titlePage);state.suspect=Object.assign(clone(DEFAULT.suspect),state.suspect);state.rules=Object.assign(clone(DEFAULT.rules),state.rules);state.task=Object.assign(clone(DEFAULT.task),state.task);setupLanguage();renderEditor();renderPreview();toast("loaded")}catch{}};r.readAsText(f);e.target.value=""}
function download(){const b=new Blob([gameHtml()],{type:"text/html;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="interrogation-game.html";a.click();URL.revokeObjectURL(a.href);toast("downloaded")}
async function copyGenially(){
 const url=(state.publishUrl||"").trim();
 if(!url){toast("noUrl");return}
 const code='<iframe src="'+url.replace(/"/g,"&quot;")+'" title="'+esc(state.title)+'" width="100%" height="800" style="border:0;border-radius:18px;display:block" allow="fullscreen"></iframe>';
 try{await navigator.clipboard.writeText(code);toast("copyDone")}catch{const ta=document.createElement("textarea");ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("copyDone")}
}
setupLanguage();wire();renderEditor();renderPreview();
</script>
